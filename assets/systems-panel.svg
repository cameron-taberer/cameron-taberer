<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Systems I Build</title>
  <desc id="desc">Watch Dogs-style system index for trading tools, internal platforms, automation, and web products.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1216"/>
      <stop offset="1" stop-color="#0D1C22"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00D9FF" stroke-opacity=".1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#panel)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect x="16" y="16" width="1168" height="388" fill="none" stroke="#00D9FF" stroke-opacity=".45" stroke-width="1.5"/>

  <!-- Module 01: Trading -->
  <g transform="translate(40,40)">
    <rect width="540" height="150" fill="#091418" stroke="#00D9FF" stroke-opacity=".55" stroke-width="1.5"/>
    <path d="M0 28H540" stroke="#00D9FF" stroke-opacity=".25"/>
    <circle cx="22" cy="14" r="4" fill="#00D9FF" filter="url(#glow)"/>
    <text x="38" y="19" fill="#00D9FF" font-family="monospace" font-size="12" letter-spacing="2">SYS_01</text>
    <text x="500" y="19" text-anchor="end" fill="#7D9BA3" font-family="monospace" font-size="11" letter-spacing="2">ACTIVE</text>
    <text x="22" y="62" fill="#E6E6E6" font-family="monospace" font-size="22" font-weight="700" letter-spacing="2">TRADING TOOLS</text>
    <text x="22" y="92" fill="#9BB4BB" font-family="monospace" font-size="13">Market data · technical analysis · multi-timeframe</text>
    <text x="22" y="122" fill="#00D9FF" font-family="monospace" font-size="12" letter-spacing="1">STACK // Python · cTrader API · React</text>
  </g>

  <!-- Module 02: Internal -->
  <g transform="translate(620,40)">
    <rect width="540" height="150" fill="#091418" stroke="#00D9FF" stroke-opacity=".55" stroke-width="1.5"/>
    <path d="M0 28H540" stroke="#00D9FF" stroke-opacity=".25"/>
    <circle cx="22" cy="14" r="4" fill="#00D9FF" filter="url(#glow)"/>
    <text x="38" y="19" fill="#00D9FF" font-family="monospace" font-size="12" letter-spacing="2">SYS_02</text>
    <text x="500" y="19" text-anchor="end" fill="#7D9BA3" font-family="monospace" font-size="11" letter-spacing="2">ACTIVE</text>
    <text x="22" y="62" fill="#E6E6E6" font-family="monospace" font-size="22" font-weight="700" letter-spacing="2">INTERNAL PLATFORMS</text>
    <text x="22" y="92" fill="#9BB4BB" font-family="monospace" font-size="13">Workflows · invoicing · reporting · guidance</text>
    <text x="22" y="122" fill="#00D9FF" font-family="monospace" font-size="12" letter-spacing="1">STACK // Angular · AWS · PostgreSQL</text>
  </g>

  <!-- Module 03: Automation -->
  <g transform="translate(40,220)">
    <rect width="540" height="150" fill="#091418" stroke="#00D9FF" stroke-opacity=".55" stroke-width="1.5"/>
    <path d="M0 28H540" stroke="#00D9FF" stroke-opacity=".25"/>
    <circle cx="22" cy="14" r="4" fill="#00D9FF" filter="url(#glow)"/>
    <text x="38" y="19" fill="#00D9FF" font-family="monospace" font-size="12" letter-spacing="2">SYS_03</text>
    <text x="500" y="19" text-anchor="end" fill="#7D9BA3" font-family="monospace" font-size="11" letter-spacing="2">ACTIVE</text>
    <text x="22" y="62" fill="#E6E6E6" font-family="monospace" font-size="22" font-weight="700" letter-spacing="2">AUTOMATION SYSTEMS</text>
    <text x="22" y="92" fill="#9BB4BB" font-family="monospace" font-size="13">Event-driven processes · operational tooling</text>
    <text x="22" y="122" fill="#00D9FF" font-family="monospace" font-size="12" letter-spacing="1">STACK // Python · AWS Lambda · APIs</text>
  </g>

  <!-- Module 04: Web -->
  <g transform="translate(620,220)">
    <rect width="540" height="150" fill="#091418" stroke="#00D9FF" stroke-opacity=".55" stroke-width="1.5"/>
    <path d="M0 28H540" stroke="#00D9FF" stroke-opacity=".25"/>
    <circle cx="22" cy="14" r="4" fill="#00D9FF" filter="url(#glow)"/>
    <text x="38" y="19" fill="#00D9FF" font-family="monospace" font-size="12" letter-spacing="2">SYS_04</text>
    <text x="500" y="19" text-anchor="end" fill="#7D9BA3" font-family="monospace" font-size="11" letter-spacing="2">ACTIVE</text>
    <text x="22" y="62" fill="#E6E6E6" font-family="monospace" font-size="22" font-weight="700" letter-spacing="2">WEB PRODUCTS</text>
    <text x="22" y="92" fill="#9BB4BB" font-family="monospace" font-size="13">Responsive · maintainable applications</text>
    <text x="22" y="122" fill="#00D9FF" font-family="monospace" font-size="12" letter-spacing="1">STACK // React · Angular · TypeScript</text>
  </g>
</svg>
