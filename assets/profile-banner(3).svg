<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Cameron Taberer — Software Developer</title>
  <desc id="desc">Watch Dogs-inspired hacker interface grid banner for Cameron Taberer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B0F"/>
      <stop offset="1" stop-color="#061B22"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00D9FF" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect x="18" y="18" width="1164" height="224" fill="none" stroke="#00D9FF" stroke-width="2"/>
  <path d="M18 72H250M950 72H1182M18 202H340M860 202H1182" stroke="#00D9FF" stroke-opacity=".6"/>
  <path d="M250 72h16M950 72h-16M340 202h16M860 202h-16" stroke="#00D9FF" stroke-width="4" filter="url(#glow)"/>
  <path d="M490 112h220M540 118h120" stroke="#FF3855" stroke-opacity=".7"/>
  <circle cx="78" cy="72" r="4" fill="#00D9FF" filter="url(#glow)"/>
  <circle cx="1122" cy="202" r="4" fill="#FF3855" filter="url(#glow)"/>
  <text x="78" y="59" fill="#E6E6E6" font-family="monospace" font-size="13" letter-spacing="3">NETWORK // CONNECTED</text>
  <text x="1122" y="59" text-anchor="end" fill="#7D9BA3" font-family="monospace" font-size="12" letter-spacing="3">PROFILE_NODE_01</text>
  <text x="600" y="132" text-anchor="middle" fill="#00D9FF" font-family="monospace" font-size="48" font-weight="700" letter-spacing="8" filter="url(#glow)">CAMERON TABERER</text>
  <text x="600" y="169" text-anchor="middle" fill="#E6E6E6" font-family="monospace" font-size="16" letter-spacing="4">SOFTWARE DEVELOPER // AUTOMATION // SYSTEMS</text>
  <text x="78" y="224" fill="#7D9BA3" font-family="monospace" font-size="12" letter-spacing="2">AWS / PYTHON / REACT / ANGULAR</text>
  <text x="1122" y="224" text-anchor="end" fill="#7D9BA3" font-family="monospace" font-size="12" letter-spacing="2">TRACE // BUILD // DEPLOY</text>
</svg>
